name: Validate dictionary

on:
  push:
    branches: [main]
    paths:
      - 'dictionary.json'
      - 'validate.py'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'dictionary.json'
      - 'validate.py'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    name: Run validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run validate.py
        run: python validate.py